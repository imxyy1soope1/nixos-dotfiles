[lockscreen]
wallpaper = "~/workspace/nixos-dotfiles/assets/wallpaper.png"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@DP-2",
    "lockscreen-widget-clock@DP-1",
    "lockscreen-widget-clock@DP-2",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
box_height = 70.0
box_width = 400.0
cx = 1024.0
cy = 675.0
output = "DP-1"
placement_height = 1152.0
placement_width = 2048.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "compact"
show_caps_lock = true
show_keyboard_layout = false
show_login_button = false
show_media = true
show_session_buttons = true
show_unlock_hint = false
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
box_height = 70.0
box_width = 400.0
cx = 1024.0
cy = 675.0
output = "DP-2"
placement_height = 1152.0
placement_width = 2048.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "compact"
show_caps_lock = true
show_keyboard_layout = false
show_login_button = false
show_media = true
show_session_buttons = true
show_unlock_hint = false
show_weather = true

[lockscreen_widgets.widget."lockscreen-widget-clock@DP-1"]
box_height = 144.0
box_width = 240.0
cx = 1024.0
cy = 480.0
output = "DP-1"
placement_height = 1152.0
placement_width = 2048.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget."lockscreen-widget-clock@DP-1".settings]
background = false
clock_style = "digital"
format = "{:%H:%M}"

[lockscreen_widgets.widget."lockscreen-widget-clock@DP-2"]
box_height = 144.0
box_width = 240.0
cx = 1024.0
cy = 480.0
output = "DP-2"
placement_height = 1152.0
placement_width = 2048.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget."lockscreen-widget-clock@DP-2".settings]
background = false
clock_style = "digital"
format = "{:%H:%M}"
